# Ask Oracle for the two free ARM instances, from GitHub rather than a laptop.
#
# The Always Free Ampere A1 capacity in ap-hyderabad-1 is almost always full:
# 1,241 attempts from a Mac over six days returned "no capacity" every time.
# The only way through is to keep asking, and there is no reason for a laptop to
# stay awake doing it.
#
# Every 5 minutes. This repository is public, so Actions minutes are unlimited;
# a private one is capped at 2,000 a month, which 5-minute runs would exhaust in
# a fortnight. That is the only reason this lives in its own repository -- it
# holds no data, only the workflow.
#
# GitHub disables scheduled workflows after 60 days with no repository activity,
# and delays or drops runs when its own load is high, so expect fewer attempts
# than the schedule implies. In practice "*/5" has produced about six runs a
# day, not 288 -- 63 runs over the first ten days. There is no way to force it.
#
# Because the runs are rare, each one has to count. Oracle rate-limits
# launch_instance per user, so firing the attempts back to back meant the first
# got a real answer ("out of capacity") and the next came back 429
# TooManyRequests, which says nothing about capacity. The loop now pauses
# between attempts and treats a 429 as "ask again" rather than as an answer.
#
# That is TWO attempts a run, not six: ap-hyderabad-1 has a single availability
# domain, so the AD loop runs once and only the two memory sizes vary. The home
# region cannot be changed, so more attempts would have to come from more shape
# configurations, not more domains.

name: oci-arm-retry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # lets you trigger one by hand

concurrency:
  group: oci-arm-retry      # never two attempts at once
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the OCI CLI
        run: |
          curl -sL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            -o /tmp/install.sh
          bash /tmp/install.sh --accept-all-defaults >/dev/null
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write the OCI config from secrets
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/key.pem
          pass_phrase=${{ secrets.OCI_PASSPHRASE }}
          CFG
          chmod 600 ~/.oci/config

      - name: Ask for capacity
        id: ask
        env:
          T: ${{ secrets.OCI_TENANCY }}
          SUBNET: ${{ secrets.OCI_SUBNET }}
          IMAGE: ${{ secrets.OCI_IMAGE }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUB }}
        run: |
          # +e, not -e: every launch attempt is EXPECTED to fail, and the
          # failures are the data. -u stays on so a missing secret is loud.
          set +e
          set -u
          # Stop if the instances already exist -- the free allowance is two.
          HAVE=$(oci compute instance list --compartment-id "$T" --all \
                   --query 'length(data[?"lifecycle-state"==`RUNNING`])' --raw-output 2>/dev/null || echo 0)
          echo "running instances: ${HAVE:-0}"
          if [ "${HAVE:-0}" -ge 2 ]; then
            echo "already have two - nothing to do"
            exit 0
          fi

          echo "$SSH_PUB" > /tmp/pub.key
          ADS=$(oci iam availability-domain list --compartment-id "$T" \
                  --query 'data[].name' --raw-output | tr -d '[]", ' | tr '\n' ' ')

          # One attempt. Returns 0 if the instance came up, 1 for a real "no
          # capacity", 2 for a rate limit -- which is not an answer about
          # capacity and must not be counted as one.
          try() {
            oci compute instance launch \
              --compartment-id "$T" --availability-domain "$1" \
              --shape VM.Standard.A1.Flex \
              --shape-config "{\"ocpus\":1,\"memoryInGBs\":$2}" \
              --image-id "$IMAGE" --subnet-id "$SUBNET" \
              --assign-public-ip true \
              --metadata "{\"ssh_authorized_keys\":\"$(cat /tmp/pub.key)\"}" \
              --display-name "gmaps-arm-$(date +%s)" \
              --wait-for-state RUNNING --wait-interval-seconds 10 2>/tmp/err && return 0
            grep -q -i "TooManyRequests\|429" /tmp/err && return 2
            return 1
          }

          # Try each availability domain, at 6 GB then 4 GB. Oracle frees
          # capacity at random, so the shape that works is unpredictable.
          #
          # PAUSE is why this works at all. Without it Oracle answered the
          # first attempt and rate-limited the next, so a run tested one
          # combination instead of two. A rate-limited attempt waits longer and
          # is retried once, because it told us nothing about capacity.
          #
          # ap-hyderabad-1 has one availability domain, so $ADS holds a single
          # entry and this is two attempts, not six.
          PAUSE=30
          for AD in $ADS; do
            [ -z "$AD" ] && continue
            for GB in 6 4; do
              for ATTEMPT in 1 2; do
                echo "asking $AD at ${GB}GB (try $ATTEMPT)"
                # `&& ... || ...` keeps this in a condition context. A bare
                # `try ...; rc=$?` is NOT: the step runs under `bash -e`, so
                # the first non-zero return killed the whole script after one
                # attempt. That regression shipped once; hence the belt and
                # braces of `set +e` on the step as well.
                try "$AD" "$GB" && rc=0 || rc=$?
                if [ $rc -eq 0 ]; then
                  echo "GOT ONE in $AD at ${GB}GB"
                  echo "got=yes" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                if [ $rc -eq 2 ]; then
                  echo "  rate limited, not an answer -- waiting 60s"
                  sleep 60
                  continue
                fi
                grep -q -i "out of capacity\|LimitExceeded\|InternalError" /tmp/err \
                  && echo "  no capacity" || { echo "  unexpected:"; cat /tmp/err; }
                break
              done
              sleep "$PAUSE"
            done
          done
          echo "no capacity anywhere this round"

      - name: Say so loudly if it worked
        if: steps.ask.outputs.got == 'yes'
        run: |
          echo "::notice title=Oracle ARM instance created::Check the OCI console"
